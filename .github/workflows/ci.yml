name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-go:
    name: Test & Lint Go Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [log-ingestor, log-generator, log-consumer]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          cache-dependency-path: ${{ matrix.service }}/go.sum
          
      - name: Vet
        working-directory: ./${{ matrix.service }}
        run: go vet ./...
        
      - name: Test
        working-directory: ./${{ matrix.service }}
        run: go test -v ./...

  lint-python:
    name: Lint Python Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install flake8
        run: pip install flake8
        
      - name: Lint with flake8
        working-directory: ./dashboard_service
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  verify-docker:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Build log-ingestor image
        run: docker build -t log-ingestor:test ./log-ingestor

      - name: Build log-generator image
        run: docker build -t log-generator:test ./log-generator

      - name: Build log-consumer image
        run: docker build -t log-consumer:test ./log-consumer

      - name: Build dashboard-service image
        run: docker build -t dashboard-service:test ./dashboard_service
  
  publish:
    name: Publish Docker Images
    needs: [test-go, lint-python, verify-docker]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push log-ingestor
        uses: docker/build-push-action@v5
        with:
          context: ./log-ingestor
          push: true
          tags: bogdanpaul15/log-ingestor:latest

      - name: Build and push log-generator
        uses: docker/build-push-action@v5
        with:
          context: ./log-generator
          push: true
          tags: bogdanpaul15/log-generator:latest

      - name: Build and push log-consumer
        uses: docker/build-push-action@v5
        with:
          context: ./log-consumer
          push: true
          tags: bogdanpaul15/log-consumer:latest

      - name: Build and push dashboard-service
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard_service
          push: true
          tags: bogdanpaul15/dashboard-service:v1
