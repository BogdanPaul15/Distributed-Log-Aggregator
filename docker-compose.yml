services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    deploy:
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - stream_net

  kafka-1:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    command:
      - bash
      - -c
      - |
        echo "Waiting for Zookeeper..."
        while ! (echo > /dev/tcp/zookeeper/2181) >/dev/null 2>&1; do sleep 2; done
        /etc/confluent/docker/run
    deploy:
      replicas: 1
    volumes:
      - kafka_data_1:/var/lib/kafka/data
    networks:
      - stream_net

  kafka-2:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29093,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    command:
      - bash
      - -c
      - |
        echo "Waiting for Zookeeper..."
        while ! (echo > /dev/tcp/zookeeper/2181) >/dev/null 2>&1; do sleep 2; done
        /etc/confluent/docker/run
    deploy:
      replicas: 1
    volumes:
      - kafka_data_2:/var/lib/kafka/data
    networks:
      - stream_net

  kafka-3:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29094,PLAINTEXT_HOST://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29094,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms512M -Xmx512M"
    command:
      - bash
      - -c
      - |
        echo "Waiting for Zookeeper..."
        while ! (echo > /dev/tcp/zookeeper/2181) >/dev/null 2>&1; do sleep 2; done
        /etc/confluent/docker/run
    deploy:
      replicas: 1
    volumes:
      - kafka_data_3:/var/lib/kafka/data
    networks:
      - stream_net

  init-kafka:
    image: confluentinc/cp-kafka:7.3.0
    entrypoint: ['/bin/sh', '-c']
    command: |
      "
      echo 'Waiting for ALL brokers to be online...'
      until kafka-topics --bootstrap-server kafka-1:29092 --list > /dev/null 2>&1; do
        echo 'Waiting for kafka-1...'; sleep 5
      done
      until kafka-topics --bootstrap-server kafka-2:29093 --list > /dev/null 2>&1; do
        echo 'Waiting for kafka-2...'; sleep 5
      done
      until kafka-topics --bootstrap-server kafka-3:29094 --list > /dev/null 2>&1; do
        echo 'Waiting for kafka-3...'; sleep 5
      done
      echo 'All brokers ready. Creating topics...'
      kafka-topics --bootstrap-server kafka-1:29092 --create --if-not-exists --topic logs --replication-factor 3 --partitions 5
      echo 'Topics created!'
      "
    networks:
      - stream_net
    deploy:
      restart_policy:
        condition: on-failure

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29093,kafka-3:29094
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    deploy:
    networks:
      - stream_net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: log_platform_db
    volumes:
      - db_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
    networks:
      - data_net

  keycloak:
    image: quay.io/keycloak/keycloak:22.0
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /auth
    configs:
      - source: keycloak_realm
        target: /opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    deploy:
      replicas: 1
    networks:
      - public_net
      - data_net

  dashboard-backend:
    image: bogdanpaul15/dashboard-service:v1
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/log_platform_db
      KEYCLOAK_URL: http://keycloak:8080/auth/realms/log-realm
      CLIENT_ID: log-client
      CLIENT_SECRET: secret
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: 9200
    ports:
      - "8000:8000"
    command:
      - bash
      - -c
      - |
        echo "Waiting for PostgreSQL..."
        until (echo > /dev/tcp/postgres/5432) >/dev/null 2>&1; do
          echo "PostgreSQL not ready, retrying in 2s..."
          sleep 2
        done
        echo "PostgreSQL is up!"
        uvicorn main:app --host 0.0.0.0 --port 8000
    deploy:
      replicas: 1
    networks:
      - public_net
      - data_net

  log-ingestor:
    image: bogdanpaul15/log-ingestor:latest
    deploy:
      replicas: 2
    environment:
      - KAFKA_BROKERS=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - KAFKA_TOPIC=logs
      - SERVER_ADDR=:8080
    command:
      - sh
      - -c
      - |
        echo "Waiting for Kafka..."
        until nc -z kafka-1 29092 2>/dev/null; do
          echo "Kafka not ready, retrying in 5s..."
          sleep 5
        done
        echo "Kafka is up!"
        ./log-ingestor
    networks:
      - stream_net
      - public_net

  log-generator:
    image: bogdanpaul15/log-generator:latest
    ports:
      - "8081:8081"
    configs:
      - source: log_generator_config
        target: /app/config.yaml
    deploy:
    command:
      - sh
      - -c
      - |
        echo "Waiting 60s for log-ingestor to start..."
        sleep 60
        echo "Starting log-generator..."
        exec ./log-generator
    networks:
      - public_net
      - stream_net

  log-consumer:
    image: bogdanpaul15/log-consumer:latest
    deploy:
      replicas: 2
    environment:
      - KAFKA_BROKERS=kafka-1:29092,kafka-2:29093,kafka-3:29094
      - KAFKA_TOPIC=logs
      - KAFKA_GROUP_ID=log-consumer-group
      - OPENSEARCH_ADDR=http://opensearch:9200
    command:
      - sh
      - -c
      - |
        echo "Waiting for all Kafka brokers..."
        until nc -z kafka-1 29092 2>/dev/null && nc -z kafka-2 29093 2>/dev/null && nc -z kafka-3 29094 2>/dev/null; do
          echo "Kafka not ready, retrying in 5s..."
          sleep 5
        done
        echo "Waiting for OpenSearch..."
        until nc -z opensearch 9200 2>/dev/null; do
          echo "OpenSearch not ready, retrying in 5s..."
          sleep 5
        done
        echo "All dependencies up!"
        ./log-consumer
    networks:
      - data_net
      - stream_net

  opensearch:
    image: opensearchproject/opensearch:2.11.0
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    deploy:
      replicas: 1
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
      - "9600:9600"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cat/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    networks:
      - data_net

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.11.0
    ports:
      - "5601:5601"
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
      SERVER_BASEPATH: "/opensearch"
      SERVER_REWRITEBASEPATH: "true"
    deploy:
      replicas: 1
    networks:
      - data_net
      - public_net

  prometheus:
    image: prom/prometheus:latest
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    deploy:
    networks:
      - stream_net
      - monitoring_net

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SERVER_DOMAIN: "localhost"
      GF_SERVER_ROOT_URL: "http://localhost:8100/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/datasource.yml
      - source: grafana_dashboard_config
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
      - source: grafana_dashboard_consumer
        target: /etc/grafana/provisioning/dashboards/log_consumer_dashboard.json
      - source: grafana_dashboard_generator
        target: /etc/grafana/provisioning/dashboards/log_generator_dashboard.json
      - source: grafana_dashboard_ingestor
        target: /etc/grafana/provisioning/dashboards/log_ingestor_dashboard.json
      - source: grafana_dashboard_system
        target: /etc/grafana/provisioning/dashboards/system_dashboard.json
    deploy:
    networks:
      - public_net
      - monitoring_net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    ports:
      - "8088:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    deploy:
      mode: global
    networks:
      - monitoring_net

  agent:
    image: portainer/agent:latest
    environment:
      AGENT_CLUSTER_ADDR: tasks.agent
    ports:
      - target: 9001
        published: 9001
        protocol: tcp
        mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - monitoring_net
    deploy:
      mode: global
  portainer:
    image: portainer/portainer-ce:lts
    command: -H tcp://tasks.agent:9001 --tlsskipverify
    ports:
      - "9443:9443"
      - "9000:9000"
    volumes:
      - portainer_data:/data
    deploy:
    networks:
      - monitoring_net

  kong:
    image: kong/kong-gateway:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_URL: http://localhost:8101
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    configs:
      - source: kong_config
        target: /etc/kong/kong.yml
    volumes:
      - kong_data:/usr/local/kong
      - kong_tmp:/tmp
    ports:
      - "8100:8000"
      - "8101:8001"
    deploy:
      replicas: 1
    networks:
      - public_net
      - data_net
      - stream_net
      - monitoring_net

networks:
  public_net:
    driver: overlay
    attachable: true
  data_net:
    driver: overlay
    attachable: true
  stream_net:
    driver: overlay
    attachable: true
  monitoring_net:
    driver: overlay
    attachable: true

volumes:
  zookeeper_data:
  zookeeper_log:
  kafka_data_1:
  kafka_data_2:
  kafka_data_3:
  db_data:
  opensearch_data:
  portainer_data:
  kong_data:
  kong_tmp:

configs:
  kong_config:
    file: ./kong/kong.yml
  prometheus_config:
    file: ./prometheus/prometheus.yml
  keycloak_realm:
    file: ./keycloak/realm-export.json
  log_generator_config:
    file: ./log-generator/config.docker.yaml
  grafana_datasource:
    file: ./grafana/provisioning/datasources/datasource.yml
  grafana_dashboard_config:
    file: ./grafana/provisioning/dashboards/dashboard.yml
  grafana_dashboard_consumer:
    file: ./grafana/provisioning/dashboards/log_consumer_dashboard.json
  grafana_dashboard_generator:
    file: ./grafana/provisioning/dashboards/log_generator_dashboard.json
  grafana_dashboard_ingestor:
    file: ./grafana/provisioning/dashboards/log_ingestor_dashboard.json
  grafana_dashboard_system:
    file: ./grafana/provisioning/dashboards/system_dashboard.json