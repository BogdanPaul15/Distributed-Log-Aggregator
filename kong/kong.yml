_format_version: "3.0"
_transform: true

services:
  - name: dashboard-backend
    url: http://dashboard-backend:8000
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: dashboard-route
        paths:
          - /
        strip_path: false
        preserve_host: true
        regex_priority: 0

  - name: keycloak
    url: http://keycloak:8080
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: keycloak-route
        paths:
          - /auth
        strip_path: false
        preserve_host: true

  - name: grafana
    url: http://grafana:3000
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: grafana-route
        paths:
          - /grafana
        strip_path: false
        preserve_host: true

  - name: kafka-ui
    url: http://kafka-ui:8080
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: kafka-ui-route
        paths:
          - /kafka-ui
        strip_path: false
        preserve_host: true

  - name: opensearch-dashboards
    url: http://opensearch-dashboards:5601
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: opensearch-dashboards-route
        paths:
          - /opensearch
        strip_path: false
        preserve_host: true

  - name: portainer
    url: http://portainer:9000
    connect_timeout: 3000
    read_timeout: 10000
    write_timeout: 10000
    routes:
      - name: portainer-route
        paths:
          - /portainer
        strip_path: true
        preserve_host: true